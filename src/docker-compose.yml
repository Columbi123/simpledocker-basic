services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: simple-server:1.0
    networks:
      do5_network:
        aliases:
          - app

  proxy:
    image: nginx:alpine
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./nginx_proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - do5_network

networks:
  do5_network:
    driver: bridge
